openapi: 3.1.0
info:
  title: Seven Spade API
  description: REST API for the Seven Spade multiplayer card game.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: api
                  dependencies:
                    type: object
                    properties:
                      postgres:
                        type: string
                        example: ok
                      redis:
                        type: string
                        example: ok

  /application-controls:
    get:
      summary: Get public application control availability
      tags: [Application]
      responses:
        "200":
          description: Current availability for player entry points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationControls"

  /guest:
    post:
      summary: Guest login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  maxLength: 50
      responses:
        "200":
          description: Guest JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "503":
          description: Guest access is disabled

  /register:
    post:
      summary: Register a new account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name, username]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: "^[a-z0-9_]+$"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtResponse"
        "409":
          description: Email or username already taken
        "503":
          description: New registrations are disabled

  /login:
    post:
      summary: Login with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Account is suspended

  /refresh:
    post:
      summary: Refresh access token
      tags: [Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Required for native clients without cookie jar
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  refresh_token:
                    type: string
                    description: Only present for native clients
        "401":
          description: Invalid or expired refresh token
        "403":
          description: Account is suspended

  /auth/logout:
    delete:
      summary: Logout and revoke refresh token
      tags: [Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Required for native clients
      responses:
        "204":
          description: Logged out

  /auth/{provider}/url:
    get:
      summary: Get OAuth authorization URL
      tags: [Authentication]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github, telegram]
        - name: redirect_uri
          in: query
          schema:
            type: string
          description: Deep-link URI for native clients
      responses:
        "200":
          description: Authorization URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  state:
                    type: string
        "503":
          description: Provider not configured

  /auth/{provider}/callback:
    post:
      summary: OAuth callback
      tags: [Authentication]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github, telegram]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                state:
                  type: string
                redirect_uri:
                  type: string
                  description: Unused — native redirect_uri is taken from the URL step / PKCE state
      responses:
        "200":
          description: OAuth login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                    description: Only present for native clients
        "401":
          description: Invalid or expired state
        "502":
          description: Provider error
        "503":
          description: New account creation is disabled; existing accounts can still sign in

  /auth/mobile/google:
    post:
      summary: Sign in to the mobile app with a Google ID token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200":
          description: Mobile session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileAuthResponse" }
        "401": { description: Invalid ID token or unverified email }
        "409": { description: Existing email account must link Google while authenticated }
        "503": { description: Google OAuth is not configured or new account creation is disabled }

  /auth/mobile/telegram/start:
    post:
      summary: Start Telegram mobile login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uri, code_challenge]
              properties:
                redirect_uri:
                  type: string
                  enum: ["sevenspade://spade/auth/callback"]
                code_challenge:
                  type: string
      responses:
        "200": { description: Telegram authorization URL generated }
        "503": { description: Telegram OAuth is not configured }

  /auth/mobile/telegram/callback:
    get:
      summary: Receive Telegram authorization and redirect to the mobile app
      tags: [Authentication]
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redirect to app with a short-lived handoff code }
        "401": { description: Invalid state or Telegram ID token }

  /auth/mobile/telegram/exchange:
    post:
      summary: Exchange a Telegram mobile handoff code for an app session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code: { type: string }
                code_verifier: { type: string }
      responses:
        "200":
          description: Mobile session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileAuthResponse" }
        "401": { description: Invalid, expired, or already used handoff }
        "409": { description: Existing account must link Telegram while authenticated }
        "503": { description: New account creation is disabled }

  /auth/forgot-password:
    post:
      summary: Request password reset email
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Always returns success (prevents email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/reset-password:
    post:
      summary: Reset password with token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset successful
        "400":
          description: Invalid, expired, or already-used token

  /auth/verify-email:
    post:
      summary: Verify email with token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified
        "400":
          description: Invalid or expired token

  /auth/resend-verification:
    post:
      summary: Resend verification email
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Verification email sent (or no-op if already verified)

  /me:
    get:
      summary: Get current user profile
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      summary: Update display name
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
      responses:
        "200":
          description: Name updated, new JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtResponse"
        "400":
          description: Invalid display name
        "401":
          description: Guest or invalid token

  /skins:
    get:
      summary: Get the active skin catalog
      description: Returns enabled skins and their ordered, machine-readable unlock alternatives. Event-only skins are present only while their event is active.
      tags: [Skins]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active skin catalog
          content:
            application/json:
              schema:
                type: object
                required: [skins]
                properties:
                  skins:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogSkin"
        "500":
          description: Failed to load skins

  /users/{id}/skins:
    get:
      summary: Get a user's equipped skins
      tags: [Skins]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public equipped appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquippedSkinsResponse"
        "400":
          description: Invalid user ID

  /me/skins:
    get:
      summary: Get owned and equipped skins
      tags: [Skins]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owned and equipped skins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSkinsResponse"
        "401":
          description: Registered account required

  /me/skins/{type}:
    put:
      summary: Equip a skin
      tags: [Skins]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SkinType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skin_id]
              properties:
                skin_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated owned and equipped skins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSkinsResponse"
        "400":
          description: Missing skin ID or invalid skin type
        "401":
          description: Registered account required
        "403":
          description: Skin is not owned by this user
    delete:
      summary: Unequip the selected skin type
      tags: [Skins]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SkinType"
      responses:
        "200":
          description: Updated owned and equipped skins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSkinsResponse"
        "400":
          description: Invalid skin type
        "401":
          description: Registered account required

  /me/delete:
    post:
      summary: Schedule account deletion (7-day grace)
      description: |
        Registered users only. Email/password accounts must send current password.
        OAuth-only accounts (no password_hash) may omit password. Revokes all refresh
        tokens and clears the refresh cookie; access JWT remains valid for cancel.
        Idempotent when already pending.
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Deletion scheduled
          content:
            application/json:
              schema:
                type: object
                required: [deletion_scheduled_at, grace_days]
                properties:
                  deletion_scheduled_at:
                    type: string
                    format: date-time
                  grace_days:
                    type: integer
                    example: 7
        "400":
          description: Password required but missing
        "401":
          description: Invalid password or user not found
        "403":
          description: Guest not allowed

  /me/cancel-deletion:
    post:
      summary: Cancel pending account deletion
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
        "403":
          description: Guest not allowed
        "409":
          description: No pending deletion

  /rooms:
    get:
      summary: List public waiting rooms
      tags: [Rooms]
      responses:
        "200":
          description: List of public rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomResponse"
    post:
      summary: Create a new room
      tags: [Rooms]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
        "409":
          description: Already in another active room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveRoomConflict"
        "503":
          description: Room creation is disabled

  /rooms/{id}:
    get:
      summary: Get room by ID
      tags: [Rooms]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
        "404":
          description: Room not found

  /rooms/{code}/join:
    post:
      summary: Join a room by invite code
      tags: [Rooms]
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRoomResponse"
        "403":
          description: Kicked or rating restricted
        "404":
          description: Room not found
        "409":
          description: Room full, not accepting, already in room, or in another room

  /rooms/quick-play:
    post:
      summary: Quick matchmaking
      tags: [Rooms]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ranked:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Joined existing room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRoomResponse"
        "201":
          description: Created new room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRoomResponse"
        "409":
          description: Already in another active room
        "429":
          description: Rate limited (3 second cooldown)
        "503":
          description: Quick Play is disabled or no compatible room exists and room creation is disabled

  /my/active-room:
    get:
      summary: Get player's current active room
      tags: [Rooms]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active room or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_room:
                    oneOf:
                      - $ref: "#/components/schemas/ActiveRoomResponse"
                      - type: "null"

  /live-games:
    get:
      summary: List in-progress public games
      tags: [Rooms]
      responses:
        "200":
          description: Live games list
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveGame"

  /history:
    get:
      summary: Get player's game history
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Paginated game history
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/GameHistoryEntry"
                  total:
                    type: integer
                  page:
                    type: integer
        "401":
          description: Guest or unauthenticated

  /games/{id}/replay:
    get:
      summary: Get game replay
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Replay data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Replay"
        "404":
          description: Replay not available, outside retention, or not owned by the authenticated player

  /games/{id}/results:
    get:
      summary: Get retained detailed game results
      description: Returns post-game details for one of the authenticated registered player's retained games.
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detailed game results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResults"
        "400":
          description: Invalid game ID
        "404":
          description: Results not available, outside retention, or not owned by the authenticated player

  /leaderboard:
    get:
      summary: Get leaderboard
      tags: [Stats]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: sort
          in: query
          schema:
            type: string
            default: win_rate
            enum:
              - win_rate
              - total_wins
              - avg_penalty
              - best_penalty
              - games_played
              - rating
              - avg_rank
              - top2_rate
              - xp
        - name: season
          in: query
          schema:
            type: string
          description: "\"all\" | \"all-time\" | \"active\" | \"current\" | specific season id (YYYY-MM)"
      responses:
        "200":
          description: Paginated leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaderboardEntry"
                  total:
                    type: integer
                  page:
                    type: integer
                  min_games:
                    type: integer
                  sort:
                    type: string
                  season:
                    type: string

  /seasons:
    get:
      summary: List seasons
      tags: [Stats]
      responses:
        "200":
          description: Season list
          content:
            application/json:
              schema:
                type: object
                properties:
                  seasons:
                    type: array
                    items:
                      $ref: "#/components/schemas/Season"

  /stats:
    get:
      summary: Get authenticated user's stats
      tags: [Stats]
      security:
        - bearerAuth: []
      parameters:
        - name: season
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"
        "401":
          description: Guest or unauthenticated

  /users/{id}/stats:
    get:
      summary: Get user stats by ID
      tags: [Stats]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: season
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"
        "404":
          description: Player not found

  /users/{id}/achievements:
    get:
      summary: Get user achievements
      tags: [Stats]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Achievements and catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  earned:
                    type: array
                    items:
                      $ref: "#/components/schemas/EarnedAchievement"
                  catalog:
                    type: array
                    items:
                      $ref: "#/components/schemas/Achievement"

  /users/{id}/rating-history:
    get:
      summary: Get user rating history
      tags: [Stats]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Paginated rating history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/RatingEvent"
                  total:
                    type: integer
                  page:
                    type: integer

  /me/login-streak:
    get:
      summary: Get daily login progress
      tags: [Rewards]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current daily login progress and reward metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStreakResponse"
        "401":
          description: Registered account required

  /me/login-streak/claim:
    post:
      summary: Claim today's daily login reward
      description: Idempotent within the configured application-local calendar day.
      tags: [Rewards]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated progress, XP award, and any newly granted skins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStreakResponse"
        "401":
          description: Registered account required
        "409":
          description: Daily login is disabled

  /events:
    get:
      summary: List events
      description: Public discovery endpoint for enabled active, upcoming, and ended events.
      tags: [Events]
      security: []
      responses:
        "200":
          description: Events ordered by active, upcoming, then ended status
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSummary"

  /events/{slug}:
    get:
      summary: Get event details
      description: Public endpoint. A bearer token is optional and enriches check-in and ownership state for registered users.
      tags: [Events]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event details, check-in progress, and skin rewards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Event not found

  /events/{slug}/check-ins:
    post:
      summary: Claim today's event check-in
      description: Idempotent within the configured application-local calendar day.
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated check-in progress and newly granted event skins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventClaimResult"
        "401":
          description: Registered account required
        "404":
          description: Event not found
        "409":
          description: Event is not active

  /friends:
    get:
      summary: List friends and pending requests
      tags: [Friends]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Friend list with presence
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      $ref: "#/components/schemas/FriendEntry"

  /users/search:
    get:
      summary: Search users for add-friend flow
      tags: [Friends]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSearchResult"
        "429":
          description: Rate limited (30/minute)

  /friends/requests:
    post:
      summary: Send friend request
      tags: [Friends]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                username:
                  type: string
      responses:
        "200":
          description: Request sent or auto-accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, accepted]
        "400":
          description: Adding yourself
        "403":
          description: Blocked
        "404":
          description: User not found

  /friends/requests/{userId}/accept:
    post:
      summary: Accept friend request
      tags: [Friends]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Request accepted
        "404":
          description: No pending request from that user

  /friends/{userId}:
    delete:
      summary: Remove friend or decline request
      tags: [Friends]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Friendship removed

  /friends/{userId}/block:
    post:
      summary: Block a user
      tags: [Friends]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User blocked
        "400":
          description: Cannot block yourself

  /internal/application-controls:
    get:
      summary: Get application controls for the WebSocket service
      tags: [Internal]
      security:
        - internalSecret: []
      responses:
        "200":
          description: Complete application control state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationControls"

  /internal/games:
    post:
      summary: Save game results
      tags: [Internal]
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameResult"
      responses:
        "201":
          description: Game saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_id:
                    type: string
                    format: uuid
                  deltas:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerDelta"

  /internal/users/{id}/access:
    get:
      summary: Check registered player access
      tags: [Internal]
      security:
        - internalSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Player access is active
        "403":
          description: Player account is suspended
        "401":
          description: Player account is unavailable

  /internal/rooms/{id}/status:
    post:
      summary: Update room status
      tags: [Internal]
      security:
        - internalSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [waiting, in_progress, finished]
      responses:
        "204":
          description: Status updated
        "404":
          description: Room not found

  /internal/rooms/{id}/players/{userId}:
    delete:
      summary: Remove player from room
      tags: [Internal]
      security:
        - internalSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Player removed

  /internal/rooms/{id}/kick/{userId}:
    post:
      summary: Kick player from room
      tags: [Internal]
      security:
        - internalSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Player kicked

  /internal/rooms/reconcile:
    post:
      summary: Reconcile orphaned rooms
      tags: [Internal]
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active_room_ids]
              properties:
                active_room_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Reconciliation complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret

  parameters:
    SkinType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [profile_background, player_card_background, avatar_frame, display_picture]

  schemas:
    ApplicationControls:
      type: object
      required: [new_registrations, guest_access, room_creation, quick_play, new_game_starts, spectator_access, emotes]
      properties:
        new_registrations:
          type: boolean
        guest_access:
          type: boolean
        room_creation:
          type: boolean
        quick_play:
          type: boolean
        new_game_starts:
          type: boolean
        spectator_access:
          type: boolean
        emotes:
          type: boolean

    MobileAuthResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    JwtResponse:
      type: object
      properties:
        jwt:
          type: string

    MeResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
        username:
          type: string
          nullable: true
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        is_guest:
          type: boolean
        email_verified:
          type: boolean
        has_password:
          type: boolean
          description: True when the account has a password_hash (email/password users)
        deletion_scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Set when account deletion is pending (grace period)
        providers:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              avatar_url:
                type: string
                format: uri
                nullable: true
              created_at:
                type: string
                format: date-time

    CreateRoomRequest:
      type: object
      required: [visibility, turn_timer_seconds]
      properties:
        name:
          type: string
          maxLength: 60
        visibility:
          type: string
          enum: [public, private]
        turn_timer_seconds:
          type: integer
          enum: [30, 60, 90, 120]
        bot_difficulty:
          type: string
          enum: [easy, medium, hard]
          default: medium
        practice_mode:
          type: boolean
          default: false
        min_elo:
          type: integer
          minimum: 0
          nullable: true
        max_elo:
          type: integer
          minimum: 0
          nullable: true
        game_mode:
          type: string
          enum: [classic, custom]
          default: classic
        max_players:
          type: integer
          minimum: 2
          maximum: 8
          default: 4
        deck_count:
          type: integer
          enum: [1, 2]
          default: 1
        scoring_mode:
          type: string
          enum: [rank_value, flat, custom]
          default: rank_value
        custom_scores:
          type: object
          minProperties: 1
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 100
          description: Non-empty map of rank (2-14) to penalty points, required when scoring_mode is "custom". Omitted ranks use rank-value scoring.
          nullable: true
        team_mode:
          type: string
          enum: [ffa, 2v2]
          default: ffa
          description: "2v2 is only valid when max_players is 4 or 6."

    RoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invite_code:
          type: string
        name:
          type: string
        visibility:
          type: string
          enum: [public, private]
        turn_timer_seconds:
          type: integer
        bot_difficulty:
          type: string
          enum: [easy, medium, hard]
        practice_mode:
          type: boolean
        min_elo:
          type: integer
          nullable: true
        max_elo:
          type: integer
          nullable: true
        game_mode:
          type: string
          enum: [classic, custom]
        max_players:
          type: integer
        deck_count:
          type: integer
        scoring_mode:
          type: string
          enum: [rank_value, flat, custom]
        custom_scores:
          type: object
          additionalProperties:
            type: integer
          nullable: true
        team_mode:
          type: string
          enum: [ffa, 2v2]
        status:
          type: string
          enum: [waiting, in_progress, finished]
        player_count:
          type: integer

    JoinRoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invite_code:
          type: string
        status:
          type: string
        player_count:
          type: integer

    ActiveRoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invite_code:
          type: string
        status:
          type: string
        practice_mode:
          type: boolean

    ActiveRoomConflict:
      type: object
      properties:
        error:
          type: string
        active_room:
          $ref: "#/components/schemas/ActiveRoomResponse"

    GameResultPlayer:
      type: object
      required: [display_name, penalty_points, rank, is_winner, is_bot, is_guest, index]
      properties:
        user_id:
          type: string
          format: uuid
        subject_id:
          type: string
          description: Stable non-user subject identifier used for guests and bots.
        display_name:
          type: string
        penalty_points:
          type: integer
        rank:
          type: integer
          minimum: 1
        is_winner:
          type: boolean
        is_bot:
          type: boolean
        is_guest:
          type: boolean
        team:
          type: integer
        facedown_cards:
          type: array
          items:
            $ref: "#/components/schemas/RevealedScoreCard"
        index:
          type: integer
          minimum: 0

    GameResult:
      type: object
      required: [room_id, started_at, finished_at, players]
      properties:
        room_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        players:
          type: array
          items:
            $ref: "#/components/schemas/GameResultPlayer"
        initial_hands:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/ReplayCard"
        moves:
          type: array
          items:
            $ref: "#/components/schemas/ReplayMove"

    GameHistoryEntry:
      type: object
      properties:
        game_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        room_name:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        penalty_points:
          type: integer
        rank:
          type: integer
        is_winner:
          type: boolean
        rating_delta:
          type: integer
          nullable: true
        replay_available:
          type: boolean

    LiveGamePlayer:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string

    LiveGame:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        invite_code:
          type: string
        started_at:
          type: string
          format: date-time
        player_count:
          type: integer
        players:
          type: array
          items:
            $ref: "#/components/schemas/LiveGamePlayer"

    ReplayCard:
      type: object
      properties:
        suit:
          type: string
        rank:
          type: integer
          description: Engine rank 2-14 (Ace=14)

    ReplayMove:
      type: object
      properties:
        index:
          type: integer
        player_index:
          type: integer
        suit:
          type: string
        rank:
          type: integer
        type:
          type: string
          enum: [play, face_down, ace_close]
        ace_direction:
          type: string
          enum: [low, high]

    ReplayPlayer:
      type: object
      properties:
        player_index:
          type: integer
        display_name:
          type: string
        is_bot:
          type: boolean
        is_winner:
          type: boolean
        rank:
          type: integer

    Replay:
      type: object
      properties:
        game_id:
          type: string
          format: uuid
        room_name:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        players:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPlayer"
        initial_hands:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/ReplayCard"
        moves:
          type: array
          items:
            $ref: "#/components/schemas/ReplayMove"

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        games_played:
          type: integer
        wins:
          type: integer
        win_rate:
          type: number
          format: float
        avg_penalty:
          type: number
          format: float
        best_penalty:
          type: integer
          nullable: true
        rating:
          type: integer
        avg_rank:
          type: number
          format: float
        top2_rate:
          type: number
          format: float
        first_place_count:
          type: integer
        human_only_games:
          type: integer
        bot_mixed_games:
          type: integer
        xp:
          type: integer
          format: int64
        level:
          type: integer

    Season:
      type: object
      properties:
        id:
          type: string
          description: UTC month bucket (YYYY-MM)
        label:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean

    Achievement:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string

    CatalogSkin:
      type: object
      required: [id, skin_type, name, description, asset_key, display_order, unlock_rules]
      properties:
        id:
          type: string
          format: uuid
        skin_type:
          type: string
          enum: [profile_background, player_card_background, avatar_frame, display_picture]
        name:
          type: string
        description:
          type: string
        asset_key:
          type: string
        display_order:
          type: integer
        unlock_rules:
          type: array
          description: Ordered alternatives; satisfying any one rule unlocks the skin.
          items:
            $ref: "#/components/schemas/SkinUnlockRule"

    SkinUnlockRule:
      type: object
      required: [rule_type]
      description: A typed unlock alternative. Only fields applicable to `rule_type` are present.
      properties:
        rule_type:
          type: string
          enum: [achievement, minimum_level, login_streak, event_check_in_count, game_condition]
        name:
          type: string
          description: Challenge name, used when a game-condition rule has no renderable conditions.
        achievement:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        minimum_level:
          type: integer
          minimum: 1
        login_streak_days:
          type: integer
          minimum: 1
        event_check_in_count:
          type: integer
          minimum: 1
        event:
          $ref: "#/components/schemas/SkinUnlockEvent"
        conditions:
          type: array
          description: Ordered conditions that must all be satisfied for a game-condition rule.
          items:
            $ref: "#/components/schemas/SkinUnlockCondition"

    SkinUnlockEvent:
      type: object
      required: [slug, name, starts_at, ends_at]
      properties:
        slug:
          type: string
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    SkinUnlockCondition:
      type: object
      required: [metric, operator, value]
      properties:
        metric:
          type: string
          enum: [is_winner, shared_win_count, penalty, games_played, wins, current_streak, current_top2_streak, first_place_count, zero_penalty_games, human_only_games, all_zero_penalty, ace_closed, game_duration_seconds]
        operator:
          type: string
          enum: [eq, gte, lte, gt, lt]
        value:
          type: string

    EarnedAchievement:
      type: object
      properties:
        achievement_id:
          type: string
        earned_at:
          type: string
          format: date-time

    RatingEvent:
      type: object
      properties:
        game_id:
          type: string
          format: uuid
        rating_before:
          type: integer
        rating_after:
          type: integer
        rating_delta:
          type: integer
        created_at:
          type: string
          format: date-time

    UserSearchResult:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true

    PlayerDelta:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        rating_delta:
          type: integer
          description: Present only when at least two registered players participated.
        rating_after:
          type: integer
          description: Present only when at least two registered players participated.
        xp_delta:
          type: integer
        xp_after:
          type: integer
          format: int64
        level:
          type: integer

    UserStats:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        games_played:
          type: integer
        wins:
          type: integer
        win_rate:
          type: number
          format: float
        avg_penalty:
          type: number
          format: float
        best_penalty:
          type: integer
          nullable: true
        worst_penalty:
          type: integer
          nullable: true
        rating:
          type: integer
        rank:
          type: integer
          nullable: true
        qualified:
          type: boolean
        avg_rank:
          type: number
          format: float
        first_place_count:
          type: integer
        second_place_count:
          type: integer
        third_place_count:
          type: integer
        fourth_place_count:
          type: integer
        zero_penalty_games:
          type: integer
        low_penalty_games:
          type: integer
        high_penalty_games:
          type: integer
        human_only_games:
          type: integer
        bot_mixed_games:
          type: integer
        current_win_streak:
          type: integer
        best_win_streak:
          type: integer
        current_top2_streak:
          type: integer
        best_top2_streak:
          type: integer
        close_wins:
          type: integer
        close_losses:
          type: integer
        blowout_wins:
          type: integer
        blowout_losses:
          type: integer
        xp:
          type: integer
          format: int64
        level:
          type: integer
        xp_into_level:
          type: integer
          format: int64
        xp_for_next_level:
          type: integer
          format: int64
        xp_to_next_level:
          type: integer
          format: int64

    RevealedScoreCard:
      type: object
      required: [suit, rank, points]
      properties:
        suit:
          type: string
          enum: [spades, hearts, diamonds, clubs]
        rank:
          type: integer
          minimum: 2
          maximum: 14
        points:
          type: integer

    GameResultDetail:
      type: object
      required: [player_index, display_name, penalty_points, rank, is_winner, is_bot, is_guest, is_me, facedown_cards]
      properties:
        player_index:
          type: integer
          minimum: 0
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        penalty_points:
          type: integer
        rank:
          type: integer
          minimum: 1
        is_winner:
          type: boolean
        is_bot:
          type: boolean
        is_guest:
          type: boolean
        is_me:
          type: boolean
        team:
          type: integer
        facedown_cards:
          type: array
          items:
            $ref: "#/components/schemas/RevealedScoreCard"
        rating_delta:
          type: integer
        rating_after:
          type: integer
        xp_delta:
          type: integer
        xp_after:
          type: integer
          format: int64
        level:
          type: integer

    GameResults:
      type: object
      required: [game_id, room_id, room_name, started_at, finished_at, replay_available, players]
      properties:
        game_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        room_name:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        replay_available:
          type: boolean
        players:
          type: array
          items:
            $ref: "#/components/schemas/GameResultDetail"

    OwnedSkin:
      type: object
      required: [id, skin_type, name, description, asset_key, display_order, unlock_rules, source, equipped]
      properties:
        id:
          type: string
          format: uuid
        skin_type:
          type: string
          enum: [profile_background, player_card_background, avatar_frame, display_picture]
        name:
          type: string
        description:
          type: string
        asset_key:
          type: string
        display_order:
          type: integer
        unlock_rules:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/SkinUnlockRule"
          description: Null because owned-skin responses do not reload catalog unlock rules.
        source:
          type: string
        equipped:
          type: boolean

    SkinGrant:
      type: object
      required: [id, skin_type, name, description, asset_key, display_order, unlock_rules, source]
      properties:
        id:
          type: string
          format: uuid
        skin_type:
          type: string
          enum: [profile_background, player_card_background, avatar_frame, display_picture]
        name:
          type: string
        description:
          type: string
        asset_key:
          type: string
        display_order:
          type: integer
        unlock_rules:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/SkinUnlockRule"
          description: Null on newly granted skins because grant responses do not reload unlock rules.
        source:
          type: string

    EquippedSkin:
      type: object
      required: [skin_type, skin_id, asset_key]
      properties:
        skin_type:
          type: string
          enum: [profile_background, player_card_background, avatar_frame, display_picture]
        skin_id:
          type: string
          format: uuid
        asset_key:
          type: string

    EquippedSkinsResponse:
      type: object
      required: [equipped]
      properties:
        equipped:
          type: array
          items:
            $ref: "#/components/schemas/EquippedSkin"

    UserSkinsResponse:
      type: object
      required: [owned, equipped]
      properties:
        owned:
          type: array
          items:
            $ref: "#/components/schemas/OwnedSkin"
        equipped:
          type: array
          items:
            $ref: "#/components/schemas/EquippedSkin"

    LoginStreakResponse:
      type: object
      required: [enabled, current_streak, best_streak, last_claim_date, claimed_today, newly_claimed, xp_delta, xp_after, level, has_login_streak_reward, next_reward_day, new_skin_grants, app_timezone]
      properties:
        enabled:
          type: boolean
          description: Whether daily login claims and UI are currently available.
        current_streak:
          type: integer
        best_streak:
          type: integer
        last_claim_date:
          type: [string, "null"]
          format: date
        claimed_today:
          type: boolean
        newly_claimed:
          type: boolean
        xp_delta:
          type: integer
        xp_after:
          type: integer
          format: int64
        level:
          type: integer
        has_login_streak_reward:
          type: boolean
        next_reward_day:
          type: [integer, "null"]
        new_skin_grants:
          type: array
          items:
            $ref: "#/components/schemas/SkinGrant"
        app_timezone:
          type: string
          description: UTC or the current numeric UTC offset used to determine the calendar day.

    Event:
      type: object
      required: [id, slug, name, summary, description, starts_at, ends_at, app_timezone, status, server_time, daily_login]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        summary:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        app_timezone:
          type: string
        hero_asset_key:
          type: string
        accent_color:
          type: string
        status:
          type: string
          enum: [upcoming, active, ended]
        server_time:
          type: string
          format: date-time
        daily_login:
          $ref: "#/components/schemas/EventDailyLogin"

    EventDailyLogin:
      type: object
      required: [enabled, xp_per_claim]
      properties:
        enabled:
          type: boolean
        xp_per_claim:
          type: integer
          minimum: 1
          maximum: 1000000

    EventSummary:
      type: object
      required: [id, slug, name, summary, starts_at, ends_at, app_timezone, status, server_time, reward_count]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        summary:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        app_timezone:
          type: string
        hero_asset_key:
          type: string
        accent_color:
          type: string
        status:
          type: string
          enum: [upcoming, active, ended]
        server_time:
          type: string
          format: date-time
        reward_count:
          type: integer
          minimum: 0

    EventCheckIn:
      type: object
      required: [authenticated, count, claimed_today]
      properties:
        authenticated:
          type: boolean
        count:
          type: integer
        claimed_today:
          type: boolean
        next_claim_at:
          type: string
          format: date-time

    EventRewardRequirement:
      type: object
      required: [type, description, completed]
      properties:
        type:
          type: string
        description:
          type: string
        progress:
          type: integer
        target:
          type: integer
        completed:
          type: boolean

    EventSkinReward:
      type: object
      required: [skin, requirement, owned]
      properties:
        skin:
          $ref: "#/components/schemas/CatalogSkin"
        requirement:
          $ref: "#/components/schemas/EventRewardRequirement"
        owned:
          type: boolean

    EventDetail:
      type: object
      required: [event, check_in, skin_rewards]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        check_in:
          $ref: "#/components/schemas/EventCheckIn"
        skin_rewards:
          type: array
          items:
            $ref: "#/components/schemas/EventSkinReward"

    EventClaimResult:
      type: object
      required: [newly_claimed, check_in, xp_delta, xp_after, level, skin_grants]
      properties:
        newly_claimed:
          type: boolean
        check_in:
          $ref: "#/components/schemas/EventCheckIn"
        xp_delta:
          type: integer
          minimum: 0
        xp_after:
          type: integer
          format: int64
          minimum: 0
        level:
          type: integer
          minimum: 1
        skin_grants:
          type: array
          items:
            $ref: "#/components/schemas/SkinGrant"

    FriendEntry:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        username:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum: [accepted, incoming, outgoing]
        online:
          type: boolean
        room_id:
          type: string
          format: uuid
