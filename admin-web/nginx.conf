server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: ${SKIN_ASSETS_ORIGIN}; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /admin-api/ {
        # The API accepts 5 MiB assets; leave room for multipart framing.
        client_max_body_size 6m;
        proxy_pass http://admin-api:8082/;
        # The browser sees the prefixed route, not the API's internal /auth path.
        proxy_cookie_path /auth /admin-api/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
