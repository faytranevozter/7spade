server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /terms {
        try_files /legal/terms.html =404;
    }

    location = /privacy {
        try_files /legal/privacy.html =404;
    }

    location = /terms/ {
        return 301 /terms$is_args$args;
    }

    location = /privacy/ {
        return 301 /privacy$is_args$args;
    }

    location /legal/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
