name: OpenAPI

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - services/api/**
      - scripts/validate-openapi.rb
      - Makefile
      - .github/workflows/openapi.yml
  pull_request:
    paths:
      - docs/**
      - services/api/**
      - scripts/validate-openapi.rb
      - Makefile
      - .github/workflows/openapi.yml
  workflow_dispatch:

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate OpenAPI
        run: make validate-openapi
